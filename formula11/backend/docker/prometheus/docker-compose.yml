# Prometheus local para ver las métricas de Formula11 (opcional, para la demo).
# Lee http://localhost:8080/actuator/prometheus con el token del superusuario guardado en ./token.
# Uso: specs/016-actuator-prometheus/quickstart.md, paso 7.
services:
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: formula11-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./token:/etc/prometheus/token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
