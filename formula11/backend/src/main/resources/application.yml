spring:
  application:
    name: formula11-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
server:
  error:
    include-message: never
app:
  clock:
    fecha-fija: ${APP_CLOCK_FECHA_FIJA:}
  cotizacion:
    cron: ${APP_COTIZACION_CRON:0 0 6 ? * MON}
  jwt:
    expiration: 3600
    secret: change-me-local-secret-key-must-be-at-least-32-bytes
  football-api:
    api-key: ${FOOTBALL_API_KEY:}
    base-url: ${FOOTBALL_API_BASE_URL:https://api.football-data.org/v4}
    api-key-header: ${FOOTBALL_API_KEY_HEADER:X-Auth-Token}
    connect-timeout: ${FOOTBALL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${FOOTBALL_API_READ_TIMEOUT:10s}
    response-timeout: ${FOOTBALL_API_RESPONSE_TIMEOUT:15s}
    cache-ttl: ${FOOTBALL_API_CACHE_TTL:15m}
    cache-maximum-size: ${FOOTBALL_API_CACHE_MAXIMUM_SIZE:500}
    minimum-request-interval: ${FOOTBALL_API_MINIMUM_REQUEST_INTERVAL:0ms}
# Fuera de los perfiles local y test, SUPERUSUARIO_EMAIL y SUPERUSUARIO_PASSWORD son obligatorias:
# sin ellas MercadoProperties falla la validación y la aplicación no arranca.
mercado:
  saldo-inicial: ${MERCADO_SALDO_INICIAL:100}
  superusuario-email: ${SUPERUSUARIO_EMAIL:}
  superusuario-password: ${SUPERUSUARIO_PASSWORD:}
logging:
  pattern:
    level: "%5p [corr:%X{correlationId}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha