spring:
  application:
    name: formula11-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/formula11
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:change-me-very-long-secret-key-1234567890}
  expiration-ms: 3600000

api:
  key:
    prefix: ${API_KEY_PREFIX:F11}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
